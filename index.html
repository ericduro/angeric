<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angeric forever? 💍❤️</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #081534;
            overflow: hidden;
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        h1 {
            margin-top: 50px;
            font-size: 2.5em;
            color: #fff;
        }
        .buttons {
            margin-top: 30px;
            position: relative;
        }
        button {
            font-size: 1.5em;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            position: absolute;
        }
        #yesButton {
            background-color: #28a745;
            color: white;
            position: static;
        }
        #noButton {
            background-color: #dc3545;
            color: white;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #imageContainer {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Angeric forever? 💍❤️</h1>
    <div class="buttons">
        <button id="yesButton" onclick="showImage()">Sí 😍</button>
        <button id="noButton" onmouseover="moveButton()">No 🙃</button>
    </div>
    <div id="imageContainer">
        <p style="color: #fff">Sabia que diries que sí! 💖</p>
    </div>
    
    <script>
        function moveButton() {
            let button = document.getElementById("noButton");
            let maxX = window.innerWidth - button.clientWidth - 20;
            let maxY = window.innerHeight - button.clientHeight - 20;
            let x = Math.random() * maxX;
            let y = Math.random() * maxY;
            
            // Asegurar que el botón se mantenga dentro de la pantalla
            x = Math.max(10, Math.min(x, maxX));
            y = Math.max(10, Math.min(y, maxY));
            
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }
        function showImage() {
            document.getElementById("imageContainer").style.display = "block";
        }
    </script>
</body>
</html>
